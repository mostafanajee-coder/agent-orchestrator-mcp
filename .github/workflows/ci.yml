name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Windows is the primary target platform; Linux guards against
    # accidental platform coupling.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # better-sqlite3 13 ships N-API prebuilt binaries; avoid an unnecessary
      # hosted-Windows node-gyp fallback when npm sees its binding.gyp file.
      - run: npm ci --ignore-scripts
      - run: npm run ci
